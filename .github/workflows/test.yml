name: Test
on: [push, pull_request]
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test e2e
      - name: Test the native release archive
        run: |
          make dist
          python3 tests/distribution.py "dist/clistream-$(go env GOOS)-$(go env GOARCH).tar.gz"
      - if: runner.os == 'Linux'
        run: make test-deployment
  apple:
    strategy:
      fail-fast: false
      matrix:
        device: [macOS, iPhone, iPad, shared]
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: command -v xcodegen || brew install xcodegen
      - run: make apple
      - name: Run app-hosted and UI tests
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          simulator() {
            xcrun simctl list devices available --json | jq -er --arg device "$1" '
              [.devices | to_entries[] | select(.key | contains("SimRuntime.iOS-")) |
               .value[] | select(.name | startswith($device))][0].udid // error("missing simulator")'
          }
          case "$DEVICE" in
            macOS) apple/test-device.sh macOS ;;
            shared)
              IPHONE_SIMULATOR_ID="$(simulator iPhone)" IPAD_SIMULATOR_ID="$(simulator iPad)" python3 apple/test-shared.py ;;
            *) SIMULATOR_ID="$(simulator "$DEVICE")" apple/test-device.sh ;;
          esac
      - name: Record individual XCTest outcomes
        if: always()
        run: |
          mkdir -p results
          for bundle in apple/build/results-*/*.xcresult apple/build/shared-*/*.xcresult; do
            [[ -f "$bundle/Info.plist" ]] || continue
            report="results/$(basename "$bundle" .xcresult).json"
            python3 apple/report-tests.py "$bundle" > "$report"
            cat "$report"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-${{ matrix.device }}-tests
          path: results/*.json
          if-no-files-found: ignore
