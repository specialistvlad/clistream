name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      device:
        description: Apple UI suite
        required: true
        type: choice
        options: [macOS, iPhone, iPad, Duo, shared]
      cases:
        description: Optional comma-separated Class/testMethod names for a single-device run
        required: false
        type: string
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.device || 'matrix' }}-${{ inputs.cases && github.run_id || 'suite' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test e2e
      - name: Test the native release archive
        run: |
          make dist
          make test-dist
      - if: runner.os == 'Linux'
        run: make test-deployment
  apple:
    strategy:
      fail-fast: false
      matrix:
        device: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.device)) || fromJSON('["macOS","iPhone","iPad","Duo","shared"]') }}
    runs-on: xcode-27
    # A cold iOS runtime must finish migrating before the per-case watchdogs start.
    timeout-minutes: ${{ matrix.device == 'Duo' && 85 || 65 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Select the tested Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - run: command -v xcodegen || brew install xcodegen
      - name: Install the simulator input test tool
        if: matrix.device != 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/simulator-hid"
          cd "$RUNNER_TEMP/simulator-hid"
          curl -fsSLo axe.tgz https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz
          echo '8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa  axe.tgz' | shasum -a 256 -c -
          tar -xzf axe.tgz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: make apple
      - name: Run app-hosted and UI tests
        env:
          DEVICE: ${{ matrix.device }}
          CLISTREAM_TEST_CASES: ${{ inputs.cases }}
          TEST_RUNNER_CLISTREAM_CAPTURE_GALLERY: "1"
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          if [[ "$DEVICE" == shared ]]; then
            [[ -z "$CLISTREAM_TEST_CASES" ]] || { echo "The shared session runs all four clients together."; exit 2; }
            shared_runtime=$(xcrun simctl list devices available --json | jq -er '
              [.devices | to_entries[] | select(.key | contains("iOS-27-"))
               | select(any(.value[]; .name == "iPhone 18 Pro") and any(.value[]; .name == "iPad Pro 11-inch (M5)"))
               | .key] | sort_by(capture("iOS-(?<version>[0-9]+(?:-[0-9]+)*)").version | split("-") | map(tonumber)) | last // error("missing shared iOS runtime")')
          fi
          simulator() {
            local id
            id=$(xcrun simctl list devices available --json | jq -er --arg device "$1" --arg runtime "${shared_runtime:-}" '
              [.devices | to_entries[] | select(.key | contains("iOS-27-"))
               | select($runtime == "" or .key == $runtime)]
              | sort_by(.key | capture("iOS-(?<version>[0-9]+(?:-[0-9]+)*)").version | split("-") | map(tonumber))
              | [.[].value[] | select(.name == $device)][-1].udid // error("missing simulator")') || return 1
            xcrun simctl rename "$id" "CLIStream CI $1" || return 1
            echo "$id"
          }
          case "$DEVICE" in
            macOS) apple/test-native.sh macOS ;;
            shared)
              make build
              export IPHONE_SIMULATOR_ID IPAD_SIMULATOR_ID
              IPHONE_SIMULATOR_ID=$(simulator 'iPhone 18 Pro')
              IPAD_SIMULATOR_ID=$(simulator 'iPad Pro 11-inch (M5)')
              go run ./scripts/apple-ui shared ;;
            iPhone) SIMULATOR_ID="$(simulator 'iPhone 18 Pro')" apple/test-native.sh ;;
            iPad) SIMULATOR_ID="$(simulator 'iPad Pro 13-inch (M5)')" apple/test-native.sh ;;
            Duo) SIMULATOR_ID="$(simulator 'iPhone Duo')" apple/test-native.sh ;;
          esac
      - name: Collect gallery screenshots
        if: always() && matrix.device != 'shared'
        run: |
          mkdir -p gallery
          mkdir -p results
          for bundle in apple/build/results-*/native.xcresult; do
            [[ -f "$bundle/Info.plist" ]] || continue
            staging=$(mktemp -d "$RUNNER_TEMP/screenshots.XXXXXX")
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$staging" >/dev/null
            jq -r '.[] | .attachments[].suggestedHumanReadableName | select(test("^audit-[0-9]+-[0-9]+-[a-z-]+_")) | split("_")[0]' "$staging/manifest.json"
            jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | test("^(command-review|ports-inspector|terminal-output)-window_")) | [.exportedFileName, (.suggestedHumanReadableName | split("_")[0])] | @tsv' "$staging/manifest.json" |
              while IFS=$'\t' read -r file name; do cp "$staging/$file" "results/$name.png"; done
            jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | test("^gallery-[a-z-]+_[0-9]+_[A-Fa-f0-9-]+\\.png$")) | [.exportedFileName, (.suggestedHumanReadableName | split("_")[0] | ltrimstr("gallery-"))] | @tsv' "$staging/manifest.json" |
              while IFS=$'\t' read -r file name; do cp "$staging/$file" "gallery/$name.png"; done
          done
      - uses: actions/upload-artifact@v4
        if: always() && matrix.device != 'shared'
        with:
          name: gallery-${{ matrix.device }}
          path: gallery/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Record individual XCTest outcomes
        if: always()
        run: |
          mkdir -p results
          for mobile in apple/build/shared-*/*.json; do
            [[ -f "$mobile" ]] && cp "$mobile" results/
          done
          for bundle in apple/build/results-*/*.xcresult apple/build/shared-*.xcresult; do
            [[ -f "$bundle/Info.plist" ]] || continue
            name=$(basename "$bundle" .xcresult)
            report="results/$name.json"
            go run ./scripts/apple-report "$bundle" > "$report"
            cat "$report"
            if jq -e '.cases[] | select(.result == "Failed" and (.test | contains("testTouchNavigationAndEditing")))' "$report" >/dev/null; then
              staging=$(mktemp -d "$RUNNER_TEMP/audit.XXXXXX")
              xcrun xcresulttool export attachments --path "$bundle" --test-id 'SessionTests/testTouchNavigationAndEditing()' --output-path "$staging" >/dev/null
              jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | startswith("Element Screenshot")) | .exportedFileName' "$staging/manifest.json" |
                while read -r file; do cp "$staging/$file" "results/audit-$file"; done
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-${{ matrix.device }}-tests
          path: results/
          if-no-files-found: ignore
