name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      device:
        description: Apple UI suite
        required: true
        type: choice
        options: [macOS, iPhone, iPad, Duo, shared]
      cases:
        description: Optional comma-separated Class/testMethod names for a single-device run
        required: false
        type: string
      screenshots:
        description: Capture the screen gallery during the device tests
        required: true
        type: boolean
        default: true
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.device || 'matrix' }}-${{ inputs.cases && github.run_id || 'suite' }}
  # Preserve in-flight results on main. Keep the latest push queued while the
  # isolated devices finish, and allow focused dispatches to diagnose failures.
  cancel-in-progress: ${{ github.event_name != 'push' }}
permissions:
  contents: read
jobs:
  go:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test e2e
      - name: Test the native release archive
        run: |
          make dist
          make test-dist
      - if: runner.os == 'Linux'
        run: make test-deployment
  apple:
    strategy:
      fail-fast: false
      matrix:
        device: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.device)) || fromJSON('["macOS","iPhone","iPad","Duo","shared"]') }}
    runs-on: xcode-27
    env:
      CLISTREAM_MAC_DEVELOPMENT_TEAM: ${{ vars.CLISTREAM_MAC_DEVELOPMENT_TEAM }}
    # A cold iOS runtime must finish migrating before the per-case watchdogs start.
    timeout-minutes: ${{ (matrix.device == 'Duo' || matrix.device == 'macOS') && 95 || 65 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Select the tested Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - run: command -v xcodegen || brew install xcodegen
      - name: Install the simulator input test tool
        if: matrix.device != 'macOS' && matrix.device != 'shared'
        run: |
          mkdir -p "$RUNNER_TEMP/simulator-hid"
          cd "$RUNNER_TEMP/simulator-hid"
          curl -fsSLo axe.tgz https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz
          echo '8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa  axe.tgz' | shasum -a 256 -c -
          tar -xzf axe.tgz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: make apple
      - name: Run app-hosted and UI tests
        env:
          DEVICE: ${{ matrix.device }}
          CLISTREAM_TEST_CASES: ${{ inputs.cases }}
          TEST_RUNNER_CLISTREAM_CAPTURE_GALLERY: ${{ (github.event_name != 'workflow_dispatch' || inputs.screenshots) && '1' || '0' }}
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          if [[ "$DEVICE" == shared && -n "$CLISTREAM_TEST_CASES" ]]; then
            echo "The shared session runs all four clients together."
            exit 2
          fi
          simulator() {
            local id
            id=$(xcrun simctl list devices available --json | jq -er --arg device "$1" '
              [.devices | to_entries[] | select(.key | contains("iOS-27-"))]
              | sort_by(.key | capture("iOS-(?<version>[0-9]+(?:-[0-9]+)*)").version | split("-") | map(tonumber))
              | [.[].value[] | select(.name == $device)][-1].udid // error("missing simulator")') || return 1
            xcrun simctl rename "$id" "CLIStream CI $1" || return 1
            echo "$id"
          }
          case "$DEVICE" in
            macOS) apple/test-native.sh macOS ;;
            shared)
              make build
              export IPHONE_SIMULATOR_ID IPAD_SIMULATOR_ID
              IPHONE_SIMULATOR_ID=$(simulator 'iPhone 18 Pro')
              IPAD_SIMULATOR_ID=$(simulator 'iPad Pro 13-inch (M5)')
              go run ./scripts/apple-ui shared ;;
            iPhone) SIMULATOR_ID="$(simulator 'iPhone 18 Pro')" apple/test-native.sh ;;
            iPad) SIMULATOR_ID="$(simulator 'iPad Pro 13-inch (M5)')" apple/test-native.sh ;;
            Duo) SIMULATOR_ID="$(simulator 'iPhone Duo')" apple/test-native.sh ;;
          esac
      - name: Verify Finder against a Linux workspace
        if: matrix.device == 'macOS' && (!inputs.cases || contains(inputs.cases, 'testFinderWorkspaceRoundTrip'))
        run: |
          if ! docker info >/dev/null 2>&1; then
            brew install docker colima qemu
            colima start --vm-type qemu --cpu 2 --memory 3 --disk 10
          fi
          apple/test-linux-host.sh macOS
      - name: Inspect Finder registration on failure
        if: failure() && matrix.device == 'macOS'
        run: |
          /usr/bin/pluginkit -m -ADv -i com.vlk.clistream.acceptance.finder || true
          /usr/bin/log show --style compact --last 65m --predicate 'subsystem == "com.vlk.clistream" AND category IN {"Finder", "FileProvider"}' | tail -150
          /usr/bin/log show --style compact --last 65m --predicate 'process == "fileproviderd" AND eventMessage CONTAINS[c] "com.vlk.clistream.acceptance"' | tail -40
      - name: Collect gallery screenshots
        if: always() && matrix.device != 'shared'
        run: |
          mkdir -p gallery
          mkdir -p results
          for bundle in apple/build/results-*/native.xcresult; do
            [[ -f "$bundle/Info.plist" ]] || continue
            staging=$(mktemp -d "$RUNNER_TEMP/screenshots.XXXXXX")
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$staging" >/dev/null
            jq -r '.[] | .attachments[].suggestedHumanReadableName | select(test("^audit-[0-9]+-[0-9]+-[a-z-]+_")) | split("_")[0]' "$staging/manifest.json"
            jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | test("^(command-review|ports-inspector|terminal-output|finder-open-error|finder-locations|finder-settings|finder-checkpoint)-window_")) | [.exportedFileName, (.suggestedHumanReadableName | split("_")[0])] | @tsv' "$staging/manifest.json" |
              while IFS=$'\t' read -r file name; do cp "$staging/$file" "results/$name.png"; done
            jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | test("^finder-(open-error|locations|settings|checkpoint)-message_")) | [.exportedFileName, (.suggestedHumanReadableName | split("_")[0])] | @tsv' "$staging/manifest.json" |
              while IFS=$'\t' read -r file name; do cp "$staging/$file" "results/$name.txt"; done
            jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | startswith("failed-desktop-")) | [.exportedFileName, (.suggestedHumanReadableName | split("_")[0])] | @tsv' "$staging/manifest.json" |
              while IFS=$'\t' read -r file name; do cp "$staging/$file" "results/$name.png"; done
            jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | test("^gallery-[a-z-]+_[0-9]+_[A-Fa-f0-9-]+\\.png$")) | [.exportedFileName, (.suggestedHumanReadableName | split("_")[0] | ltrimstr("gallery-"))] | @tsv' "$staging/manifest.json" |
              while IFS=$'\t' read -r file name; do cp "$staging/$file" "gallery/$name.png"; done
          done
      - uses: actions/upload-artifact@v4
        if: always() && matrix.device != 'shared'
        with:
          name: gallery-${{ matrix.device }}
          path: gallery/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify the complete Mac design gallery
        if: matrix.device == 'macOS' && !inputs.cases && (github.event_name != 'workflow_dispatch' || inputs.screenshots)
        run: |
          missing=0
          for board in servers-tree port-forwards open-session-menu server-menu rename-server welcome disconnected add-server confirm-server pairing-error edit-command stop-confirmation remove-server menu-file menu-edit menu-view menu-session menu-server; do
            for appearance in '' '-dark'; do
              file="gallery/$board$appearance.png"
              if [[ ! -s "$file" ]]; then
                echo "::error::Missing Mac design capture $file"
                missing=1
              fi
            done
          done
          exit "$missing"
      - name: Record individual XCTest outcomes
        if: always()
        run: |
          mkdir -p results
          for bundle in apple/build/results-*/*.xcresult apple/build/shared-*.xcresult; do
            [[ -f "$bundle/Info.plist" ]] || continue
            name=$(basename "$bundle" .xcresult)
            report="results/$name.json"
            go run ./scripts/apple-report "$bundle" > "$report"
            cat "$report"
            jq -r '.cases[] | select(.result == "Failed" and (.test | test("testTerminalKeysAndAttachOnly|testConcurrentViewers"))) | .test' "$report" |
              while IFS= read -r test; do
                staging=$(mktemp -d "$RUNNER_TEMP/control-receipt.XXXXXX")
                xcrun xcresulttool export attachments --path "$bundle" --test-id "$test" --output-path "$staging" >/dev/null
                jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | startswith("control-input-receipt_")) | .exportedFileName' "$staging/manifest.json" |
                  while IFS= read -r file; do cat "$staging/$file"; done
              done
            if jq -e '.cases[] | select(.result == "Failed" and (.test | contains("testTouchNavigationAndEditing")))' "$report" >/dev/null; then
              staging=$(mktemp -d "$RUNNER_TEMP/audit.XXXXXX")
              xcrun xcresulttool export attachments --path "$bundle" --test-id 'SessionTests/testTouchNavigationAndEditing()' --output-path "$staging" >/dev/null
              jq -r '.[] | .attachments[] | select(.suggestedHumanReadableName | startswith("Element Screenshot")) | .exportedFileName' "$staging/manifest.json" |
                while read -r file; do cp "$staging/$file" "results/audit-$file"; done
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-${{ matrix.device }}-tests
          path: results/
          if-no-files-found: ignore
