name: CLIStream
options:
  postGenCommand: mkdir -p CLIStream.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved CLIStream.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  bundleIdPrefix: com.vlk
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.14.0
settings:
  base:
    CLISTREAM_APP_ID: com.vlk.clistream
    PRODUCT_BUNDLE_IDENTIFIER: "$(CLISTREAM_APP_ID)"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: Bridge/Core.h
    OTHER_LDFLAGS: "$(inherited) -framework Security -framework CoreFoundation -framework SystemConfiguration -lresolv"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targetTemplates:
  Client:
    type: application
    sources:
      - path: App
      - path: ../LICENSE
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - framework: build/Core.xcframework
        embed: false
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: CLIStream
targets:
  CLIStream-iOS:
    templates: [Client]
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  CLIStream-SharedTestHost:
    templates: [Client]
    platform: iOS
    sources: [SharedTestSupport]
    settings:
      base:
        PRODUCT_NAME: CLIStreamSharedTestHost
        PRODUCT_BUNDLE_IDENTIFIER: com.vlk.clistream.shared-acceptance
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLISTREAM_SHARED_TEST_HOST"
  CLIStream-macOS:
    templates: [Client]
    platform: macOS
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac.entitlements

  CLIStream-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, TestSupport]
    dependencies:
      - target: CLIStream-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlk.clistream.uitests
        PRODUCT_NAME: CLIStreamUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CLIStream-iOS
        SWIFT_OBJC_BRIDGING_HEADER: ""
  CLIStream-MacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, TestSupport]
    dependencies:
      - target: CLIStream-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlk.clistream.macuitests
        PRODUCT_NAME: CLIStreamMacUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CLIStream-macOS
        SWIFT_OBJC_BRIDGING_HEADER: ""
  CLIStream-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClientTests, TestSupport]
    dependencies:
      - target: CLIStream-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlk.clistream.iostests
        PRODUCT_NAME: CLIStreamClientTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CLIStream.app/CLIStream"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_BRIDGING_HEADER: ""
  CLIStream-MacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClientTests, TestSupport]
    dependencies:
      - target: CLIStream-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlk.clistream.mactests
        PRODUCT_NAME: CLIStreamMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CLIStream.app/Contents/MacOS/CLIStream"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_BRIDGING_HEADER: ""
schemes:
  CLIStream-SharedTestHost:
    build:
      targets:
        CLIStream-SharedTestHost: all
  CLIStream-macOS:
    build:
      targets:
        CLIStream-macOS: all
    test:
      targets: [CLIStream-MacTests, CLIStream-MacUITests]
  CLIStream-iOS:
    build:
      targets:
        CLIStream-iOS: all
    test:
      targets: [CLIStream-iOSTests, CLIStream-UITests]
